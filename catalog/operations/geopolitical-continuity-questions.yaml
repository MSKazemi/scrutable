    evidence_required: [fallback impact and rights assessment, destination due diligence, affected-party review, security privacy and labor control tests]
    expected_outputs: [fallback risk comparison, prohibited fallback criteria, residual-risk and approval record]
    answered_by_roles: [risk owner, qualified legal owner, ethics owner, security owner, affected-party representative]
    revisit_when: [fallback destination, supplier, workforce, authority, control, impact, or alternative changes]
