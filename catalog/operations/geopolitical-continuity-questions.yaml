  - id: operations.regional-relocation.001
    version: 1
    status: published
    question: Can essential operations move legally, safely, securely, and reversibly to another region, supplier, network, payment path, or operating entity?
    purpose: Verify that geographic diversification is an executable and lawful capability rather than a diagram containing correlated or prohibited alternatives.
    domain: operations
    lifecycle_stages: [design, build, verify, release, operate, evolve, retire]
    applies_when: [continuity may require changing region, supplier, infrastructure, payments, or legal entity]
    answer_type: structured
    criticality: critical
