    criticality: critical
    depends_on: [operations.regional-exposure.001, legal.obligations.001]
    activates: [operations.regional-relocation.001, operations.regional-assets.001, operations.regional-triggers.001]
    related_to: [core.domain-pack.001, operations.sensing-sources.001]
    evidence_required: [qualified jurisdiction-specific review, screened party and ownership evidence, controlled item and data-flow classification, dated authority register]
    expected_outputs: [regional obligation register, restricted-party and controlled-flow controls, legal review schedule]
    answered_by_roles: [qualified legal owner, trade compliance owner, privacy owner, finance owner]
    revisit_when: [law, designation, ownership, item classification, data flow, government request, jurisdiction, or official interpretation changes]
    tags: [geopolitical-continuity, sanctions, export-controls]

