questions:
  - id: operations.regional-exposure.001
    version: 1
    status: published
    question: Which countries, regions, currencies, networks, cloud regions, suppliers, staff, customers, and operating entities create concentrated exposure?
    purpose: Make correlated geographic and jurisdictional dependencies visible before one regional event disables multiple fallback paths.
    domain: operations
    lifecycle_stages: [discover, define, design, release, operate, evolve, retire]
    applies_when: [people, data, funds, infrastructure, suppliers, customers, or legal entities span or depend on particular regions]
    answer_type: structured
    criticality: critical
    depends_on: [business.continuity.001, architecture.dependencies.001, data.inventory.001]
    activates: [operations.regional-obligations.001, operations.regional-disruption.001, operations.regional-assets.001]
    related_to: [team.continuity-dependencies.001, business.distribution-risk.001]
    evidence_required: [country and region dependency inventory, beneficial ownership and entity map, currency network supplier staff and customer concentration analysis]
    expected_outputs: [regional exposure map, concentration register, correlated-failure scenarios]
    answered_by_roles: [business continuity owner, legal owner, operations owner, finance owner]
    revisit_when: [region, entity, supplier, staff, customer, network, currency, or concentration changes]
    tags: [geopolitical-continuity, regional-exposure, concentration]

  - id: operations.regional-obligations.001
    version: 1
    status: published
    question: Which sanctions, export controls, import rules, ownership restrictions, data localization, government-access duties, or related jurisdictional obligations apply?
