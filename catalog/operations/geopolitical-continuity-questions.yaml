    expected_outputs: [people protection plan, regional communication matrix, support and escalation routes]
    answered_by_roles: [people safety owner, local leadership, communications owner, affected-party representative]
    revisit_when: [threat, location, population, channel access, movement, employment, or support capability changes]
    tags: [geopolitical-continuity, people-safety, communication]

