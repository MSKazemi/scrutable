    activates: [operations.regional-fallback-risks.001]
    related_to: [data.lifecycle.001, reliability.recovery.001, operations.release.001]
    evidence_required: [jurisdiction and contract clearance, data and system migration test, alternate payment and supplier exercise, capacity and reversibility evidence]
    expected_outputs: [regional relocation plan, approved alternatives, migration and reversal runbook]
    answered_by_roles: [operations owner, qualified legal owner, architecture owner, finance owner]
    revisit_when: [destination, law, contract, data location, capacity, supplier, payment path, or reversibility changes]
    tags: [geopolitical-continuity, relocation, diversification]

