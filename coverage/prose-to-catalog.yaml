        source_text: "Who owns relevant domains, accounts, prior code names, artwork, and naming research?"
      - source_id: "docs/07-naming-and-identity.md::legal-and-reputational-risk::56"
        source_label: "56"
        source_text: "Does the name imply certification, affiliation, geography, capability, safety, or results that cannot be substantiated?"
      - source_id: "docs/07-naming-and-identity.md::legal-and-reputational-risk::57"
        source_label: "57"
        source_text: "Could the name violate a contract, platform rule, naming policy, or regulated terminology rule?"
      - source_id: "docs/07-naming-and-identity.md::legal-and-reputational-risk::58"
        source_label: "58"
        source_text: "Has qualified legal counsel reviewed the finalists when commercial or reputational stakes justify it?"
      - source_id: "docs/07-naming-and-identity.md::legal-and-reputational-risk::59"
        source_label: "59"
        source_text: "What is the cost and fallback plan if the name must change later?"
      - source_id: "docs/07-naming-and-identity.md::legal-and-reputational-risk::60"
        source_label: "60"
        source_text: "Is the naming evidence and final approval recorded?"
  - source_path: "docs/07-naming-and-identity.md"
    section: "Search visibility and collision audit"
    section_anchor: "search-visibility-and-collision-audit"
    coverage: compressed
    mapping_mode: section_many_to_many
    catalog_ids: [product.naming-validation.001, business.machine-discovery.001, business.channels.001, business.attention-quality.001, business.distribution-risk.001, business.earned-media.001, security.threats.001, legal.naming-rights.001]
    rationale: "Each source question remains authoritative prose detail while the listed stable records provide reusable graph selection and propagation. Exact semantic parity is not claimed."
    questions:
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::61"
        source_label: "61"
        source_text: "What appears on Google and Bing for the exact name in quotation marks in every important market and language?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::62"
        source_label: "62"
        source_text: "What appears when the name is searched without quotation marks?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::63"
        source_label: "63"
        source_text: "What appears for `name + product category`, `name + problem solved`, and the most likely remembered misspellings?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::64"
        source_label: "64"
        source_text: "Is an older company, discontinued product, historical figure, famous brand, project, or acronym already strongly associated with the name?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::65"
        source_label: "65"
        source_text: "Does an existing entity have enough links, history, coverage, users, or authority to dominate branded search results?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::66"
        source_label: "66"
        source_text: "Are the first result pages relevant, neutral, negative, unsafe, or likely to confuse the intended audience?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::67"
        source_label: "67"
        source_text: "Can the official website, repository, app listing, or profile realistically become a leading result for the exact name?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::68"
        source_label: "68"
        source_text: "Do search engines interpret the candidate as a misspelling or variant of a more established name?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::69"
        source_label: "69"
        source_text: "Are knowledge panels, maps, images, news, videos, app results, or shopping results dominated by another entity?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::70"
        source_label: "70"
        source_text: "Is the exact or confusingly similar name used on GitHub, GitLab, npm, PyPI, container registries, app stores, social networks, and relevant industry directories?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::71"
        source_label: "71"
        source_text: "Are useful domains and common misspellings available, or are they controlled by competitors, unrelated brands, domain sellers, or malicious actors?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::72"
        source_label: "72"
        source_text: "Is the name associated with spam, malware, scams, scandals, adult content, extremism, or political controversy?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::73"
        source_label: "73"
        source_text: "Can intended users distinguish and find the product when searching only from memory, without a supplied link?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::74"
        source_label: "74"
        source_text: "Is the name distinctive enough to build and own branded search results over time without relying on a large advertising budget?"
      - source_id: "docs/07-naming-and-identity.md::search-visibility-and-collision-audit::75"
        source_label: "75"
        source_text: "Has the team recorded each query, locale, date, leading result, link or screenshot, risk judgment, and final approval?"
  - source_path: "docs/07-naming-and-identity.md"
    section: "Candidate generation questions"
    section_anchor: "candidate-generation-questions"
    coverage: guidance_only
    mapping_mode: section_many_to_many
    catalog_ids: []
    rationale: "Candidate-generation prompts expand options; candidates must still pass published naming questions before acceptance."
    questions:
      - source_id: "docs/07-naming-and-identity.md::candidate-generation-questions::1"
        source_label: "1"
        source_text: "Which words do users naturally use for the problem, outcome, and category?"
      - source_id: "docs/07-naming-and-identity.md::candidate-generation-questions::2"
        source_label: "2"
        source_text: "Which metaphors express the product's role: guide, bridge, lens, workshop, shield, engine, map, or companion?"
      - source_id: "docs/07-naming-and-identity.md::candidate-generation-questions::3"
        source_label: "3"
        source_text: "Which names can be made from a familiar word, compound, phrase, founder name, place, acronym, or invented sound?"
      - source_id: "docs/07-naming-and-identity.md::candidate-generation-questions::4"
        source_label: "4"
        source_text: "What naming territories are strategically different rather than minor variations of one idea?"
      - source_id: "docs/07-naming-and-identity.md::candidate-generation-questions::5"
        source_label: "5"
        source_text: "Can each candidate be explained in one sentence without inventing a complicated story?"
      - source_id: "docs/07-naming-and-identity.md::candidate-generation-questions::6"
        source_label: "6"
        source_text: "What happens when we deliberately generate the opposite tone—formal versus playful, abstract versus descriptive, compact versus expressive?"
      - source_id: "docs/07-naming-and-identity.md::candidate-generation-questions::7"
        source_label: "7"
        source_text: "Which candidates remain strong after removing logo concepts and visual styling?"
      - source_id: "docs/07-naming-and-identity.md::candidate-generation-questions::8"
        source_label: "8"
        source_text: "Which candidates would a competitor be unlikely to choose?"
