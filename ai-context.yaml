schema_version: "1.0"
project:
  name: Product Questionbook
  repository: MSKazemi/mohsen
  default_branch: main
  framework_version: "0.7"
  purpose: Evidence-backed product and system decision assurance
  status: documentation_first

truth:
  canonical_sources:
    - docs/
    - catalog/
    - schemas/
    - templates/
    - decisions/
    - coverage/
    - packs/
  structured_question_source: catalog/
  domain_pack_manifest_source: packs/
  run_specific_answers_belong_in_framework_repo: false
  executable_runtime_available: false
  success_guarantee: false

architecture:
  primary_interface: versioned_text_files
  canonical_human_format: markdown
  canonical_structured_format: yaml
  cli_required: false
  api_required: false
  database_required: false
  optional_validator_role: deterministic_conformance_checks
  architecture_decision: decisions/ADR-0003-text-first-agent-native-architecture.md

entrypoints:
  human_quickstart: QUICKSTART.md
  agent_instructions: AGENTS.md
  method: docs/00-method.md
  machine_contract: docs/08-machine-operation-and-outputs.md
  convergence_contract: docs/09-output-convergence-and-implementation.md
  usage_protocol: docs/11-usage-deployment-and-agent-integration.md
  request_coverage_audit: docs/15-request-coverage-and-operational-readiness-audit.md
  prose_coverage: docs/16-prose-to-catalog-coverage.md
  domain_pack_governance: docs/17-domain-pack-governance.md
  external_sensing: docs/18-external-sensing-and-attention.md
  repository_integration_audit: docs/19-whole-repository-integration-audit.md
  information_integrity: docs/20-information-integrity-and-content-governance.md
  geopolitical_continuity: docs/21-geopolitical-and-regional-continuity.md
  contribution_guide: CONTRIBUTING.md
  worked_example: examples/sample-application/README.md

agent_load_order:
  minimum:
    - ai-context.yaml
    - AGENTS.md
    - docs/00-method.md
    - catalog/core/project-profile.yaml
    - schemas/project-profile.schema.json
  assurance_run:
    - docs/08-machine-operation-and-outputs.md
    - docs/09-output-convergence-and-implementation.md
    - docs/10-self-improvement-and-adversarial-governance.md
    - docs/11-usage-deployment-and-agent-integration.md
  organizational_change:
    - catalog/business/questions.yaml
    - catalog/team/organizational-change-questions.yaml
  workforce_continuity:
    - catalog/team/questions.yaml
    - catalog/team/workforce-continuity-questions.yaml
  external_sensing:
    - docs/18-external-sensing-and-attention.md
    - catalog/operations/external-sensing-questions.yaml
    - templates/external-signal-register.md
  information_integrity:
    - docs/20-information-integrity-and-content-governance.md
    - catalog/ethics/questions.yaml
    - catalog/ethics/information-integrity-questions.yaml
    - templates/content-integrity-register.md
  geopolitical_continuity:
    - docs/21-geopolitical-and-regional-continuity.md
    - catalog/business/questions.yaml
    - catalog/operations/geopolitical-continuity-questions.yaml
    - templates/regional-continuity-register.md
  regulated_or_safety_critical:
    - docs/17-domain-pack-governance.md
    - catalog/core/domain-pack-governance-questions.yaml
    - schemas/domain-pack.schema.json
  framework_change:
    - CONTRIBUTING.md
    - docs/structured-foundation.md
    - schemas/question.schema.json
    - schemas/prose-coverage.schema.json
    - schemas/domain-pack.schema.json
    - coverage/prose-to-catalog.yaml
    - CHANGELOG.md

run_contract:
  default_location: runs/<run-id>/
  default_owner: target_project
  canonical_layout: docs/09-output-convergence-and-implementation.md#output-package-layout
  manifest_template: templates/run-manifest.md
  pin_required:
    - target_revision
    - questionbook_ref
  start_catalog: catalog/core/project-profile.yaml
  allowed_gate_results:
    - proceed
    - proceed_with_conditions
    - pause
    - stop
  required_claim_fields:
    - evidence
    - confidence
    - owner
    - verification_method
    - review_trigger

outputs:
  canonical: versioned_decision_and_assurance_package
  minimum:
    - run_manifest
    - product_or_system_brief
    - question_and_evidence_ledger
    - decisions
    - risks_and_blockers
    - next_experiments_or_actions
    - gate_report
  full_contract: docs/08-machine-operation-and-outputs.md
  canonical_layout: docs/09-output-convergence-and-implementation.md#output-package-layout

rules:
  - Unknown is a valid answer; fabricated evidence is not.
  - Separate facts, observations, inferences, assumptions, predictions, preferences, and decisions.
  - Keep brainstorming candidates separate from accepted answers.
  - Revalidate reverse dependencies when a consequential answer changes.
  - Preserve published stable question IDs; deprecate rather than repurpose them.
  - Critical blockers cannot be averaged away by unrelated positive scores.
  - Do not claim that this framework guarantees real-world or market success.
  - Provenance or authenticity does not prove truth; preserve context, uncertainty, appeal, correction, and downstream propagation.

permission_boundaries:
  require_separate_explicit_authorization:
    - deployment
    - contacting_people
    - spending_money
    - destructive_actions
    - hardware_or_robot_control
    - moving_people_data_credentials_funds_or_operations
  autonomous_framework_publication: forbidden

formats:
  human_documents: markdown
  structured_records: yaml
  validation_schemas: json_schema
  text_encoding: utf-8

validation:
  current:
    - Validate YAML records against the matching schema in schemas/.
    - Resolve every declared relationship target to a published stable ID.
    - Account for every in-scope numbered prose question in coverage/prose-to-catalog.yaml and preserve compressed detail.
    - Treat a required but unavailable, unpublished, expired, suspended, or out-of-scope domain pack as a blocker.
    - Never claim complete or continuous external visibility; record source boundaries, access failures, detection delay, and blind spots.
    - Check required evidence and ownership for consequential claims.
    - Apply blocker rules before returning a gate result.
  automated_validator_available: false
  optional_validator_planned: true
  validator_must_not_own_canonical_state: true
  deferred_full_engine_stack: decisions/ADR-0001-engine-implementation-stack.md
